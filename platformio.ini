[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Module is an N16R8: 16 MB quad flash + 8 MB octal PSRAM. The board default is
; 8 MB / no PSRAM, so these are required to match the actual hardware.
;
; Flash size MUST be set via board_upload.*, not board_build.flash_size - the
; latter is silently ignored, leaving 8 MB in the bootloader image header. A
; 16 MB partition table against an 8 MB header makes the second-stage
; bootloader reject the table and reset, boot-looping the board ~34x/sec before
; it prints anything, so the serial monitor stays blank and tells you nothing.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The board has two Type-C ports. Serial goes out the UART one (CH343 bridge ->
; UART0), so CDC_ON_BOOT stays 0. Set it to 1 only if the cable moves to the
; native USB port, which enumerates separately as VID 303A.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    ; Lets modules include each other by path from the src root, e.g.
    ; #include "core/pipeline.h", rather than by fragile relative paths.
    -I src

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; No monitor_port / upload_port here on purpose: PlatformIO auto-detects the
; board by USB vendor ID, so this file stays portable across machines. If
; detection ever picks the wrong port, override per command:
;   pio run -t upload --upload-port COM5

; --- Tests -------------------------------------------------------------------
; Two tiers. Pure logic runs on the host in milliseconds and needs no board;
; anything touching a peripheral or the scheduler runs on the board itself.
;
;   pio test -e native   fast, no hardware, safe for CI
;   pio test -e target   requires the board connected
;
; Host tier compiles only the Arduino-free sources, which is what keeps the
; response parsers testable against captured fixtures.
[env:native]
platform = native
test_filter = test_native_*
test_build_src = yes
build_src_filter = +<sources/*/*_parse.cpp>
build_flags = -I src -std=c++17
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:target]
extends = env:esp32-s3-devkitc-1
test_filter = test_embedded_*
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
